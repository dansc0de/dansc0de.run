title = 'dansc0de.run'
theme = 'hugo-theme-terminal'
pagination.pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

[params]
  contentTypeName = "posts"
  showMenuItems = 2
  fullWidthTheme = false
  centerTheme = false
  subtitle = "software engineer | sre | instructor"
  menuMore = "posts"
  readMore = "read more"
